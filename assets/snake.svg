<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="880" height="144" viewBox="0 0 880 144" role="img" aria-labelledby="title">
  <title id="title">A snake looping around a contribution grid</title>
  <defs>
    <pattern id="grid" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="12" height="12" rx="2" class="cell" />
    </pattern>
    <path id="track" d="M22 22 H838 V118 H22 Z" />
    <style>
      .cell { fill: #ebedf0; }
      .segment { fill: #9333b8; }
      .head { fill: #7e22ce; }
      .eye { fill: #fff; }
      @media (prefers-color-scheme: dark) {
        .cell { fill: #30363d; }
      }
    </style>
  </defs>

  <rect x="16" y="16" width="832" height="112" fill="url(#grid)" />

  <g aria-hidden="true">
    <rect class="segment" x="-6" y="-6" width="12" height="12" rx="3">
      <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
        <mpath href="#track" xlink:href="#track" />
      </animateMotion>
    </rect>
    <rect class="segment" x="-6" y="-6" width="12" height="12" rx="3">
      <animateMotion dur="14s" begin="-0.12s" repeatCount="indefinite" rotate="auto">
        <mpath href="#track" xlink:href="#track" />
      </animateMotion>
    </rect>
    <rect class="segment" x="-6" y="-6" width="12" height="12" rx="3">
      <animateMotion dur="14s" begin="-0.24s" repeatCount="indefinite" rotate="auto">
        <mpath href="#track" xlink:href="#track" />
      </animateMotion>
    </rect>
    <rect class="segment" x="-6" y="-6" width="12" height="12" rx="3">
      <animateMotion dur="14s" begin="-0.36s" repeatCount="indefinite" rotate="auto">
        <mpath href="#track" xlink:href="#track" />
      </animateMotion>
    </rect>
    <rect class="segment" x="-6" y="-6" width="12" height="12" rx="3">
      <animateMotion dur="14s" begin="-0.48s" repeatCount="indefinite" rotate="auto">
        <mpath href="#track" xlink:href="#track" />
      </animateMotion>
    </rect>
    <rect class="segment" x="-6" y="-6" width="12" height="12" rx="3">
      <animateMotion dur="14s" begin="-0.60s" repeatCount="indefinite" rotate="auto">
        <mpath href="#track" xlink:href="#track" />
      </animateMotion>
    </rect>
    <rect class="segment" x="-6" y="-6" width="12" height="12" rx="3">
      <animateMotion dur="14s" begin="-0.72s" repeatCount="indefinite" rotate="auto">
        <mpath href="#track" xlink:href="#track" />
      </animateMotion>
    </rect>
    <g class="head">
      <rect x="-6" y="-6" width="12" height="12" rx="3" />
      <circle class="eye" cx="-2" cy="-2" r="1" />
      <circle class="eye" cx="2" cy="-2" r="1" />
      <animateMotion dur="14s" repeatCount="indefinite" rotate="auto">
        <mpath href="#track" xlink:href="#track" />
      </animateMotion>
    </g>
  </g>
</svg>
